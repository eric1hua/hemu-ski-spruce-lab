<!doctype html><html lang="zh">
<script type="module" crossorigin src="../../assets/main-CSnS5S5l.js"></script>
<meta charset="utf-8"><title>Spruce lab — 参数化雪云杉 vs 现有锥树</title>
<style>body{background:#dfe9ee;margin:0;font:15px system-ui}canvas{display:block}nav{background:#fffffff0;border-radius:8px;width:308px;padding:14px 16px;position:absolute;top:16px;left:16px;box-shadow:0 2px 12px #00000026}nav b{font-size:16px}button{font:inherit;cursor:pointer;background:#f4f7f9;border:1px solid #bbb;border-radius:6px;margin:3px 2px;padding:5px 9px}button.on{color:#fff;background:#2f6d4f;border-color:#2f6d4f}label{color:#345;justify-content:space-between;align-items:center;margin:7px 0;font-size:13px;display:flex}label input{width:150px}output{white-space:pre-wrap;color:#234;margin:8px 0;font:12px/1.55 monospace;display:block}.hint{color:#567;font-size:12.5px;line-height:1.6}.row{margin:8px 0}</style>
<nav>
<b>雪云杉生成器 v1</b><br>
<span class="hint">前排左 1 = 游戏现在的树（3 层锥）；其余全是代码生成的，无外部模型。</span>
<div class="row" id="profiles"></div>
<label>积雪 snow <input id="snow" type="range" min="0" max="1" step="0.05"></label>
<label>下垂 droop <input id="droop" type="range" min="0" max="1" step="0.05"></label>
<label>不规则 irregularity <input id="irr" type="range" min="0" max="1.5" step="0.05"></label>
<label>层数 tiers <input id="tiers" type="range" min="4" max="9" step="1"></label>
<div class="row"><button id="reseed">换一批种子 🎲</button><button id="spin">旋转开/关</button></div>
<output id="stats">加载中…</output>
<div class="hint">鼠标拖拽旋转 · 滚轮缩放 · 右键平移<br>滑杆只重生前排中间那棵「调参树」和后排林子。<br>面数对比看 output：近景新树是旧树（73 面）的约 5 倍，但旧树远景 12 面、新远景 48 面，都在分块 InstancedMesh 预算内。</div>
</nav></html>
